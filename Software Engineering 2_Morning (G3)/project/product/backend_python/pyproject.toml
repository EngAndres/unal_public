[project]
name = "backend-python"
version = "0.1.0"
description = "This is a set of web services of an e-commerce to handle sellers and products."
authors = [
    {name = "Andres Sierra",email = "casierrav@unal.edu.co"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "uvicorn (>=0.38.0,<0.39.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "fastapi (>=0.122.0,<0.123.0)",
    "pymongo (>=4.15.4,<5.0.0)"
]

[tool.poetry]
packages = [{include = "backend_python", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "pylint (>=4.0.3,<5.0.0)"
]
